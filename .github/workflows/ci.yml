name: Tests and API smoke
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core plus API test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . 'fastapi>=0.110' 'uvicorn>=0.29' 'httpx>=0.27' 'pytest>=8'
      - name: Original regression suite
        run: python -m unittest discover -s tests -v
      - name: Extension regression suite
        run: python -m unittest discover -s tests_ext -v
      - name: End-to-end offline smoke
        run: |
          python -m pdsia.cli demo > /tmp/original-brief.txt
          python -m pdsia_plus.cli demo > /tmp/guarded-brief.json
          python -m pdsia.cli eval > /tmp/eval.txt
      - name: Bytecode compile
        run: python -m compileall -q src app
