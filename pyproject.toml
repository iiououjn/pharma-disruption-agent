[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdsia"
version = "0.1.0"
description = "Pharmaceutical supply disruption investigation agent (demo; US FDA data + simulated catalogue)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2"]
ui = ["streamlit>=1.33", "pandas>=2.0"]
agent = ["langgraph>=0.2"]

[tool.setuptools.packages.find]
where = ["src"]
